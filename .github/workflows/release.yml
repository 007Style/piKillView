name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            cgo_enabled: "1"
            cc: ""
            extra_flags: ""
            ext: ""

          - name: macos-amd64
            runner: macos-13
            goos: darwin
            goarch: amd64
            cgo_enabled: "1"
            cc: ""
            extra_flags: ""
            ext: ""

          - name: linux-amd64
            runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            cgo_enabled: "1"
            cc: ""
            extra_flags: ""
            ext: ""

          - name: linux-arm64
            runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            cgo_enabled: "1"
            cc: ""
            extra_flags: ""
            ext: ""

          - name: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cgo_enabled: "1"
            cc: ""
            extra_flags: ""
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            pkg-config

      - name: Install Windows dependencies (MSYS2/GCC)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Build binary (non-Windows)
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        run: |
          mkdir -p dist
          go build -ldflags "-s -w" -o dist/piKillView-${{ matrix.name }}${{ matrix.ext }} .

      - name: Build binary (Windows)
        if: matrix.goos == 'windows'
        shell: msys2 {0}
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -H=windowsgui" -o dist/piKillView-${{ matrix.name }}.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piKillView-${{ matrix.name }}
          path: dist/piKillView-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/* \
            --title "piKillView ${TAG}" \
            --notes "piKillView ${TAG} — From the minds of IBM Bob & Daneyand"

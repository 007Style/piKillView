name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            cgo_enabled: "1"
            cc: ""
            apt_pkgs: ""
            ext: ""

          - name: macos-amd64
            runner: macos-13
            goos: darwin
            goarch: amd64
            cgo_enabled: "1"
            cc: ""
            apt_pkgs: ""
            ext: ""

          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo_enabled: "1"
            cc: ""
            apt_pkgs: "libgl1-mesa-dev xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev"
            ext: ""

          - name: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cgo_enabled: "1"
            cc: aarch64-linux-gnu-gcc
            apt_pkgs: "libgl1-mesa-dev xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev gcc-aarch64-linux-gnu"
            ext: ""

          - name: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            cgo_enabled: "1"
            cc: x86_64-w64-mingw32-gcc
            apt_pkgs: "libgl1-mesa-dev xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev gcc-mingw-w64"
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install system dependencies
        if: matrix.apt_pkgs != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkgs }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -ldflags "-s -w" -o dist/piKillView-${{ matrix.name }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piKillView-${{ matrix.name }}
          path: dist/piKillView-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="piKillView ${TAG} — From the minds of IBM Bob & Daneyand"
          gh release create "$TAG" dist/* \
            --title "piKillView ${TAG}" \
            --notes "${NOTES}"
